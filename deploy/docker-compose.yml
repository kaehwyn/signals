# docker compose -f deploy/docker-compose.yml up -d --build      (logs: docker compose logs -f)
services:
  spidey:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../spidey.env
    volumes:
      - ../data:/data
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
