name: signals

# GitHub Actions jobs max out at 6h, so the bot runs ~5h40m, saves, and STARTS ITS OWN NEXT RUN right away
# (scheduled runs alone are often delayed by GitHub, which caused the overnight gaps). The cron is only a
# safety net in case the chain breaks. State is also pushed mid-run every 30 min (SPIDEY_GIT_SYNC_MINUTES).
# For true 24/7 uptime use a VPS with systemd/docker instead (see DEPLOY.md) and disable this workflow.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Post one sample of every message type instead of scanning"
        type: boolean
        default: false

permissions:
  contents: write            # commit state.json back to the repo
  actions: write             # start the next run when this one ends

concurrency:
  group: signals
  cancel-in-progress: false  # never cut a running scan short; the next one waits its turn

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # GitHub's limit is 360 per job; the bot stops itself at 340 and saves first
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests websocket-client

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_TRACKER_WEBHOOK_URL: ${{ secrets.DISCORD_TRACKER_WEBHOOK_URL }}
          DISCORD_WINS_WEBHOOK_URL: ${{ secrets.DISCORD_WINS_WEBHOOK_URL }}
          DISCORD_GRAVEYARD_WEBHOOK_URL: ${{ secrets.DISCORD_GRAVEYARD_WEBHOOK_URL }}
          DISCORD_EARLY_WEBHOOK_URL: ${{ secrets.DISCORD_EARLY_WEBHOOK_URL }}
          DISCORD_RECAP_WEBHOOK_URL: ${{ secrets.DISCORD_RECAP_WEBHOOK_URL }}
          DISCORD_BOT_WEBHOOK_URL: ${{ secrets.DISCORD_BOT_WEBHOOK_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          SPIDEY_GIT_SYNC_MINUTES: "30"
        run: python memecoin_bot.py ${{ inputs.test && '--test' || '--max-minutes 340' }}

      - name: Save state
        if: ${{ !inputs.test && always() }}
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json radar_log.csv signals.jsonl last_status.txt 2>/dev/null || true
          [ -d backups ] && git add backups
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          git pull --rebase -X theirs origin main || git rebase --abort
          git push

      - name: Start the next run
        if: ${{ !inputs.test && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run signals.yml --ref main -R ${{ github.repository }}
