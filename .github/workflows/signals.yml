name: signals

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum is 5 min; runs can be delayed when GitHub is busy
  workflow_dispatch:
    inputs:
      test:
        description: "Send a fake test embed instead of scanning"
        type: boolean
        default: false

permissions:
  contents: write            # lets the job commit state.json back to the repo

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_RADAR_WEBHOOK_URL: ${{ secrets.DISCORD_RADAR_WEBHOOK_URL }}
          DISCORD_HEARTBEAT_WEBHOOK_URL: ${{ secrets.DISCORD_HEARTBEAT_WEBHOOK_URL }}
          DISCORD_TRACKER_WEBHOOK_URL: ${{ secrets.DISCORD_TRACKER_WEBHOOK_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          BUBBLEMAPS_API_KEY: ${{ secrets.BUBBLEMAPS_API_KEY }}
        run: python memecoin_bot.py ${{ inputs.test && '--test' || '--max-minutes 4.5' }}

      - name: Save state
        if: ${{ !inputs.test }}
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json radar_log.csv signals.jsonl
          git diff --cached --quiet || (git commit -m "update state" && git push)
