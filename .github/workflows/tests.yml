name: tests

on:
  push:
    paths: ["**.py", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests websocket-client pytest
      - run: python -m pytest -q tests
